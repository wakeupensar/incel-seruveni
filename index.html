<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dijital Kitap</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Georgia', serif;
      background-color: #121212;
      color: #e0e0e0;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px 10px;
    }

    /* SİTE ÜST KISMI (HEADER) */
    header {
      text-align: center;
      margin-bottom: 25px;
      max-width: 800px;
      width: 100%;
      border-bottom: 1px solid #333;
      padding-bottom: 15px;
    }
    header h1 {
      font-size: 2.2rem;
      color: #ffffff;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }
    header p {
      font-size: 1rem;
      color: #aaa;
      font-style: italic;
    }

    /* KİTAP OKUYUCU KONTEYNERİ */
    .book-container {
      width: 100%;
      max-width: 720px;
      background-color: #1e1e1e;
      border: 1px solid #333;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      padding: 35px 30px;
      min-height: 500px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
    }

    /* SAYFA İÇERİĞİ ALANI */
    .page-content {
      font-size: 1.15rem;
      line-height: 1.8;
      color: #dddddd;
      white-space: pre-line; /* Metin paragraflarını korur */
      overflow-y: auto;
      max-height: 550px;
      padding-right: 10px;
    }

    /* KONTROL BUTONLARI VE SAYFA NUMARASI */
    .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 25px;
      padding-top: 15px;
      border-top: 1px solid #2a2a2a;
    }
    button {
      background-color: #2e2e2e;
      color: #fff;
      border: 1px solid #444;
      padding: 10px 20px;
      font-size: 0.95rem;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s ease;
    }
    button:hover:not(:disabled) {
      background-color: #444;
    }
    button:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }
    .page-number {
      font-size: 0.9rem;
      color: #888;
    }
  </style>
</head>
<body>

  <!-- ÜST KISIM (BAŞLIK / AÇIKLAMA) -->
  <header>
    <h1 id="book-title">Bir Eşeğin Rüyası</h1>
    <p id="book-subtitle">Yazar: Ensarcan | Dijital Eser</p>
  </header>

  <!-- SAĞA / SOLA KAYDIRMALI KİTAP PENCERESİ -->
  <div class="book-container">
    <div class="page-content" id="page-text">
      Sayfa yükleniyor...
    </div>

    <div class="controls">
      <button id="prev-btn" onclick="prevPage()">◄ Önceki Sayfa</button>
      <span class="page-number" id="page-num">Sayfa 1 / 1</span>
      <button id="next-btn" onclick="nextPage()">Sonraki Sayfa ►</button>
    </div>
  </div>

  <script>
    // TÜM KİTAP SAYFALARI (Sana vereceğim sayfaları buradaki tırnakların arasına ekleyeceksin)
const pages = [
      `SAYFA 1

BÖLÜM 1: ODADAKİ BİYOLOJİK TEHLİKE VE AURA EKSİLEME

Odanın kapısını açtığınız an burnunuza çarpan o ilk koku, insan evladının tanık olabileceği en büyük trajedilerden biriydi. Yarımlanmış enerji içeceği kutuları, masanın altında kendi ekosistemini kurmuş bayat cips paketleri ve en az üç haftadır yıkanmadığı için sertleşip dik duran çoraplar... Berat denilen bu vasıfsız insan organizması, tam ortada, sandalyesinin gıcırtıları eşliğinde bilgisayar ekranına yapışmış durumdaydı. Sandalye artık onun poposunun bir uzvuna dönüşmüş, adeta vücutla bütünleşmişti.

Bu çocuğun ne bir hayat gayesi vardı ne de geleceğe dair ufacık bir hayali. Akşama kadar ekran karşısında kamburunu çıkarıp oturmaktan sırtı kamburlaşmış, yüzü güneş görmediği için patates çuvalı gibi sararmıştı. Hayatındaki tek başarı kriteri LoL'de silver kümesinde kalabilmek, Rust sunucusunda elin Rus veledine evini kaptırmamak ve CS2'de takıma yük olmaktı. 

Kendi kafasında kurduğu o ezik fanteziler bir yana, gerçek dünyada eline dişi eli bile değmemiş, bir tane kız bile buna dönüp "merhaba" dememişti. Katıksız bir asosyal, tam anlamıyla hayırsız bir evlat abidesiydi.`,

      `SAYFA 2

Odanın kapısı pat diye açıldı ve içeriye elinde viledasıyla annesi Saadet teyze girdi. Saadet teyzenin gözlerindeki o bıkkınlık, bir annenin evladından umudunu kestiği o son raddeydi.

"Oğlum senin bu odanın hali ne?!" diye avazı çıktığı kadar bağırdı Saadet teyze. "Pencereli zindan yaptın ulan burayı! Bakkala iki adım git desen gitmezsin, bir baltaya sap olmazsın, sabahtan akşama kadar o meretin tepesinde ömrünü çürüttün hayırsız! Yüzün insan yüzüne benzemekten çıktı, göbeğin kat kat oldu, senin gibi evlat olmaz olsun!"

Berat kafasını o devasa kulaklığın altından zorla kaldırıp, gözlerini devirerek çemkirdi: "Of anne afk'yım diyorum ya! Dur flex maçındayım, bağırma şurada auranı bozuyorsun amk!"

Saadet teyze elindeki vileda sapını yere vurup gözlerini devirdi: "Ne aurası be zevzek! Evde ekmek bitti ekmek! 20 yaşına geldin, daha sokakta bir tane arkadaşın yok, anca o ekran karşısında milletin anasına avradına sövüp 'mid diff' diye bağırıyorsun. Senin gibi hayırsızın teki ancak bu evde yatar zaten!"`,

      `SAYFA 3

Saadet teyze kapıyı çarptı gitti. Berat ise hırsından, sinirinden gıcırlayan sandalyesinde yaylanıp klavyeye yumruk atmaya çalıştı ama kola içip cips yemekten pelteye dönmüş kollarında o güç bile yoktu. Klavye sadece hafifçe gıcırdadı.

Berat içten içe "Ulan ben aslında anlaşılamayan bir dâhiyim, bu millet benim yüksek ıq seviyemi kaldıramıyor" diye kendini avutmaya çalışsa da acı gerçek ortadaydı: Berat, mahallenin en ezik, en çirkin ve en işe yaramaz insanıydı. Dışarı çıktığı an adımları birbirine dolaşır, ellerini cebine mi koysa, dışarıda mı tutsa bilemez, kaldırımda yürürken kendi ayağına takılıp düşme tehlikesi atlatırdı.

Sokakta karşıdan havalı birileri gelse Berat’ın beyni anında mavi ekran verir, kapüşonunu gözlerine kadar çekip duvara yapışarak yürümeye başlardı. Sokaktaki mahalle kedisi bile buna ters ters bakar, Berat panikleyip yolunu değiştirirdi. Aura puanı eksi yüz binlerde gezinen tam bir fiyaskoydu.`,

      `SAYFA 4

BÖLÜM 2: DİSCORD KRALLIĞI VE SOKAK TRAVMALARI

Berat'ın tüm sosyal krallığı Discord'daki üç kişilik bomboş sunucusundan ibaretti. O sunucuda 'Yönetici' rolüne sahip olmak ona sanki dünyayı yönetiyormuş gibi bir güç hissi veriyordu. Ancak odadaki tek canlı kendisi ve odaya kurduğu ses botuydu.

Mikrofonu açıp konuşmak onun için uzaya mekik fırlatmak kadar stresli bir işti. Genellikle sesli kanalda "mute" tuşuna basar, sohbet alanına arada bir sadece nokta (.) atarak "buradayım" mesajı vermeye çalışırdı. Sunucudakiler acıyıp "Berat yaşıyor musun lan?" diye sorunca da "Afk'ydim kanka ya, sular idaresinden aradılar da" gibi hayatında bir kez bile yapmadığı yetişkin yalanları uydururdu.

Masanın üzerindeki üç günlük küflenmiş kek parçası ve dibinde iki parmak kalmış asidi kaçmış kola ile baş başa kaldığında, yine kendi ezik dünyasına gömülürdü. Bilgisayarda birilerini vurunca kendisini kral sanır, ama gerçekte anasının attığı bir terlikle yatağın altına saklanacak kadar korkak bir tipti.`,

      `SAYFA 5

BÖLÜM 3: BAKKAL SEFERİ VE BÜYÜK REZİLLİK

Birkaç gün sonra Saadet teyzenin baskılarına dayanamayıp zorunlu olarak dışarı çıkmak zorunda kaldı. Saadet teyze eline 50 lira tutuşturup "Git bakkaldan iki kilo yoğurt al, yolda da düzgün yürü mal mal bakma insanlara!" diyerek bunu sokağa fırlattı.

Berat kapüşonlusunu kafasına geçirip, gözlerini kaldırımlara dikerek yürümeye başladı. Yolda mahallenin gençleri kaldırımda oturmuş çay içiyordu. Berat onları görünce panikten adımlarını öyle bir hızlandırdı ki, sanki arkasından polis kovalıyordu. Tam gençlerin önünden geçerken ayağı kaldırım taşına takıldı, yoğurt parası elinden fırlayıp rüzgarda uçtu.

Mahalledeki gençler bastı kahkahayı. Berat kıpkırmızı olmuş suratıyla parayı çimlerin arasından toplarken gruptan biri "Yavaş lan koşucu, maratona mı yetişiyon!" diye bağırdı. Berat cevap bile veremedi, sadece önüne bakıp "Tamam kanka" gibi anlamsız bir şey mırıldanıp bakkala doğru kaçtı. Aura puanı o an itibarıyla tamamen yok olmuştu.`
    ];

    let currentPage = 0;

    function renderPage() {
      const pageTextEl = document.getElementById('page-text');
      const pageNumEl = document.getElementById('page-num');
      const prevBtn = document.getElementById('prev-btn');
      const nextBtn = document.getElementById('next-btn');

      pageTextEl.innerText = pages[currentPage];
      pageNumEl.innerText = `Sayfa ${currentPage + 1} / ${pages.length}`;

      prevBtn.disabled = currentPage === 0;
      nextBtn.disabled = currentPage === pages.length - 1;

      // Sayfa değişince en üste kaydır
      pageTextEl.scrollTop = 0;
    }

    function nextPage() {
      if (currentPage < pages.length - 1) {
        currentPage++;
        renderPage();
      }
    }

    function prevPage() {
      if (currentPage > 0) {
        currentPage--;
        renderPage();
      }
    }

    // Sağa - Sola klavye ok tuşları ile sayfa değiştirme
    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight') nextPage();
      if (e.key === 'ArrowLeft') prevPage();
    });

    // Sayfa yüklendiğinde ilk sayfayı göster
    renderPage();
  </script>
</body>
</html>
