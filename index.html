  <script>
    const pages = [
      `SAYFA 1

Odanın kapısını açtığınız an burnunuza çarpan o leş kokusu, insan evladının tanık olabileceği en büyük trajedilerden biriydi. Yarımlanmış enerji içeceği kutuları, masanın altında kendi ekosistemini kurmuş bayat cips paketleri ve en az üç haftadır yıkanmadığı için kaskatı kesilmiş kirli çoraplar... Berat denilen bu vasıfsız insan organizması, sandalyesinin gıcırtısı eşliğinde ekranın karşısında erimekteydi.

Bu çocuğun ne bir hayat gayesi vardı ne de geleceğe dair ufacık bir hedefi. Akşama kadar ekran karşısında kamburunu çıkarıp oturmaktan sırtı bükülmüş, yüzü güneş görmediği için patates çuvalı gibi sararmıştı. Hayatındaki tek başarı kriteri LoL'de silver kümesinde kalabilmek, Rust sunucusunda elin veledine evini kaptırmamak ve CS2'de takıma yük olmaktı.

Kendi kafasında kurduğu o ezik fanteziler bir yana, gerçek dünyada eline dişi eli bile değmemiş, bir tane kız bile buna dönüp "merhaba" dememişti. Katıksız bir asosyal, tam anlamıyla hayırsız bir evlat abidesiydi amk.`,

      `SAYFA 2

Odanın kapısı güm diye açıldı ve içeriye elinde viledasıyla Saadet teyze daldı. Saadet teyzenin gözlerindeki o bıkkınlık, bir annenin evladından umudunu kestiği o son raddeydi.

"Oğlum senin bu odanın hali ne amk?!" diye avazı çıktığı kadar bağırdı Saadet teyze. "Pencereli zindan yaptın ulan burayı! Bakkala iki adım git desen gitmezsin, bir baltaya sap olmazsın, sabahtan akşama kadar o meretin tepesinde ömrünü çürüttün hayırsız! Yüzün insan yüzüne benzemekten çıktı, göbeğin kat kat oldu, senin gibi evlat olmaz olsun amk!"

Berat kafasını o devasa kulaklığın altından zorla kaldırıp çemkirdi: "Of anne afk'yım diyorum ya! Dur flex maçındayım, bağırma şurada auramı siktirme şimdi amk!"

Saadet teyze elindeki vileda sapını yere vurup gözlerini devirdi: "Ne aurası be zevzek piç! Evde ekmek bitti ekmek! 20 yaşına geldin, daha sokakta bir tane arkadaşın yok, anca o ekran karşısında milletin anasına avradına sövüp 'mid diff' diye bağırıyorsun amk hayırsızı!"`,

      `SAYFA 3

Saadet teyze kapıyı çarptı gitti. Berat ise hırsından, sinirinden gıcırdayan sandalyesinde yaylanıp klavyeye yumruk atmaya çalıştı ama kola içip cips yemekten pelteye dönmüş kollarında o güç bile yoktu. Klavye sadece hafifçe gıcırdadı amk.

Berat içten içe "Ulan ben aslında anlaşılamayan bir dahiyim, bu millet benim yüksek IQ seviyemi kaldıramıyor amk" diye kendini avutmaya çalışsa da acı gerçek ortadaydı: Berat, mahallenin en ezik, en çirkin ve en işe yaramaz insanıydı. Dışarı çıktığı an adımları birbirine dolaşır, ellerini cebine mi koysa, dışarıda mı tutsa bilemez, kaldırımda yürürken kendi gölgesinden bile tırsardı amk.

Sokakta karşıdan havalı birileri gelse Berat’ın beyni anında mavi ekran verir, kapüşonunu gözlerine kadar çekip duvara yapışarak yürümeye başlardı. Sokaktaki mahalle kedisi bile buna ters ters bakar, Berat panikleyip yolunu değiştirirdi. Aura puanı eksi yüz binlerde gezinen tam bir fiyaskoydu amk.`,

      `SAYFA 4

Berat'ın tüm sosyal krallığı Discord'daki üç kişilik bomboş sunucusundan ibaretti. O sunucuda 'Yönetici' rolüne sahip olmak ona sanki dünyayı yönetiyormuş gibi bir güç hissi veriyordu. Ancak odadaki tek canlı kendisi ve odaya kurduğu ses botuydu amk.

Mikrofonu açıp konuşmak onun için uzaya mekik fırlatmak kadar stresli bir işti. Genellikle sesli kanalda "mute" tuşuna basar, sohbet alanına arada bir sadece nokta (.) atarak "buradayım" mesajı vermeye çalışırdı. Sunucudakiler acıyıp "Berat yaşıyor musun lan amk?" diye sorunca da "Afk'ydım kanka ya, sular idaresinden aradılar da" gibi hayatında bir kez bile yaşanmamış yalanlar uydururdu.

Masanın üzerindeki üç günlük küflenmiş kek parçası ve dibinde iki parmak kalmış asidi kaçmış kola ile baş başa kaldığında, yine kendi ezik dünyasına gömüldü. Bilgisayarda birilerini vurunca kendisini kral sanır, ama gerçekte anasının attığı bir terlikle yatağın altına saklanacak kadar korkak bir tipti amk.`,

      `SAYFA 5

Birkaç gün sonra Saadet teyzenin baskılarına dayanamayıp zorunlu olarak dışarı çıkmak zorunda kaldı. Saadet teyze eline 50 lira tutuşturup "Git bakkaldan iki kilo yoğurt al, yolda da düzgün yürü mal mal bakma insanlara amk!" diyerek bunu sokağa fırlattı.

Berat kapüşonunu kafasına çekip merdivenleri üçer beşer indi. Sokağa çıktığı an güneş ışığı gözlerini öyle bir yaktı ki sanki vampir gibi alev alacağını sandı amk. Ellerini ceplerine soktu, omuzlarını çökertti ve kafasını yere eğerek yürümeye başladı.

Tam bakkala yaklaşmıştı ki mahallenin piç veletleri bunu gördü. Veletlerden biri "Ooo Berat ağabey, yine mi maça gidiyorsun amk, tipine tüküreyim!" diye bağırdı. Berat cevap bile veremedi, sanki dili boğazına kaçmıştı. Sadece adımlarını hızlandırıp bakkala daldı. Aura puanı yerin dibine girmiş, rezilliği mahalle sınırlarını aşmıştı amk.`,

      `SAYFA 6

Bakkal Hüseyin amca Berat’ı görünce gözlüklerinin üstünden ters ters baktı. "Ne var lan hayırsız? Yine ne istiyorsun?" dedi. Berat kekeleyerek, "Ş-şey... iki kilo yoğurt amk... yani Hüseyin amca" diyebildi. Hüseyin amca yoğurdu masaya koyup, "Parayı uzat lafı uzatma" dedi.

Berat cebindeki buruşuk 50 lirayı çıkarırken parayı yere düşürdü. Eğilip parayı alırken kafasını bakkalın tezgahına "ÇAT" diye vurdu. Bakkaldaki diğer müşteriler kahkahayı bastı. Berat kıpkırmızı olmuş suratıyla yoğurdu kaptığı gibi bakkaldan dışarı fırladı.

Koşarak eve dönerken ayağı kaldırımdaki taş parçasına takıldı. Berat dengesini kaybedip yere kapaklandı, yoğurt kabı patladı ve tüm yoğurt Berat’ın suratına, üstüne başı sıvandı. Mahallenin köpekleri bile gelip bunun üstündeki yoğurdu yalamaya başladı amk. Bu çocuk doğuştan ezik, doğuştan bahtsız bir orospu çocuğuydu amk.`,

      `SAYFA 7

Üstü başı yoğurt içinde, suratında köpeğin salyalarıyla eve dönen Berat’ı görünce Saadet teyzenin elindeki çalı süpürgesi yere düştü. Kadın bir anlık şokun ardından belindeki merdaneyi çıkardığı gibi Berat’ın üzerine yürümeye başladı.

"Ulan yoğurt almayı bile beceremeyen gerizekalı piç!" diye bağırıp merdaneyi Berat’ın sırtına geçirdi. "Seni doğuracağıma taş doğursaydım en azından üzerine otururdum amk hayırsızı!" Berat "Anne valla köpekler saldırdı amk!" diye bağırarak odasına kaçtı ve kapıyı kilitledi.

Odaya girer girmez yatağın altına saklandı. Üstündeki yoğurt kokusuyla baş başa kalan Berat, "Benim bu dünyada ne işim var amk" diye düşündü ama sonra "Aman siktir et, aksama Rust wipe var" diyerek bilgisayarın düğmesine bastı. Islah olmaz, düzelmez, katıksız bir ezikti bu amk.`,

      `SAYFA 8

Gece saat 03:00'e geldiğinde Berat hâlâ ekranın karşısındaydı. Discord'da sesli kanala bir velet girdi. Velet bununla dalga geçmeye başladı: "Ulan Berat, senin tipini sikeyim amk, geçen gün seni bakkalın önünde yoğurt içinde görmüşler, mahallenin maskarası olmuşsun hâlâ burada oyun oynuyorsun amk eziği!"

Berat hırslandı, mikrofonu açıp "Kes ulan velet! Ben burada krallık kuruyorum, senin sülaleni sikerim!" diye bağırmaya çalıştı ama sesi ergenlikten çıkamamış gibi detone oldu, cırtlak bir ses çıktı. Velet gülmekten yarıldı: "Lan git önce sesin düzelsin amk çakma alfa!"

Berat sinirden klavyeyi ısırdı. Dişlerinin arasında kalan plastiğin tadı bile onun bu ezik hayatının özeti gibiydi. Kulaklığı masaya fırlattı, gözleri doldu. "Ulan ben ne zaman birilerini yeneceğim amk?" diye düşündü. Ama cevap basitti: Hiçbir zaman. Çünkü o bir vasıfsızdı amk.`,

      `SAYFA 9

Sabahın köründe Saadet teyze kapıyı kıracak gibi vurmaya başladı. "Kalk ulan gavat! Bugün komşunun oğlu Ahmet'in düğünü var, takımı giyip benimle geleceksin!" diye kükredi. Berat yorgun gözlerle kapıyı açtı, "Anne ne düğünü amk ya, benim sosyalleşme katsayım sıfır biliyorsun!" dedi.

Saadet teyze dinlemedi, Berat’ın babasından kalma, en az 15 senelik, güve yenikli, omuzları vatkalı devasa takımı Berat’ın kafasına fırlattı. "Giyeceksin ulan! İnsan içine çık azıcık, herkes seni öldü sanıyor amk evladı!"

Berat çaresizce o iğrenç takımı giydi. Takım buna öyle bol geldi ki sanki babasının ceketini giymiş ilkokul çocuğu gibi görünüyordu. Aynaya baktı, kendine sövdü: "Tipini sikeyim Berat, tam bir palyaço oldun amk" diyerek banyodan çıktı.`,

      `SAYFA 10

Düğün salonuna girdiklerinde yüksek sesli halay müziği Berat’ın beynini tırmalamaya başladı. Saadet teyze bunu kolundan tuttuğu gibi akrabaların masasına doğru sürükledi. Masadaki herkes Berat’a bakıp kıkırdamaya başladı amk.

Akrabalardan biri "Ooo Berat bey, siz dışarı çıkar mıydınız ya? Maşallah en son gördüğümüzde ortaokula gidiyordun, hâlâ boyun uzamamış amk" diye dalga geçti. Berat'ın aura puanı bir kez daha eksilere düştü. Sandalyenin ucuna ilişti, ellerini nereye koyacağını bilemedi.

Önündeki kuru pastadan bir ısırık aldı ama pasta o kadar bayattı ki Berat’ın boğazına tıkandı. Öksürmeye başladı, yüzü morardı. Saadet teyze "Yavaş ye ulan kıtlıktan çıkmış gibi!" diyerek Berat’ın sırtına sertçe bir yumruk indirdi. Berat’ın ağzındaki pasta parçaları masadaki teyzenin çay bardağına fırladı amk. Rezillik silsilesi devam ediyordu.`,

      `SAYFA 11

Düğün salonundaki bu rezillikten sonra Berat masanın altına girmek istedi. Masadaki teyze çay bardağına fırlayan pasta parçasını görünce "Ayyy terbiyesiz! İnsan gibi yemeyi de bilmiyor bu hayırsız!" diye çemkirdi. Saadet teyze utancından yerin dibine girdi, Berat’ın kulağını tutup öyle bir sıktı ki Berat’ın gözlerinden yaşlar geldi amk.

"Kulağımı koparttın anne valla amk!" diye mırıldandı Berat. Saadet teyze "Sus ulan zevzek! Kalk halaya gir azıcık insan gör!" diyerek bunu pistin ortasına fırlattı. Berat halay çeken insanların arasında ne yapacağını bilemedi, ellerini sallamaya çalışırken halay başındaki adamın elini tutmaya çalıştı ama adam bunun elini tiksinerek geri itti amk.

Berat pistin ortasında mal gibi kaldı. Herkes bunu izleyip gülüyordu. Berat panikleyip geri geri kaçmaya çalışırken garsonun tepsisine çarptı. Tepsideki 10 tane meşrubat bardağı Berat’ın omuz vatkalı takım elbisesinin üzerine döküldü. Berat baştan aşağı Fanta ve Kola içinde kaldı amk. Katıksız bir felaketti bu çocuk.`,

      `SAYFA 12

Üstü başı yapış yapış Kola kokan Berat, düğün salonunun tuvaletine kaçtı. Aynaya baktı, ıslak mendille ceketini silmeye çalıştı ama sildikçe leke daha da büyüdü. "Benim anamı avradımı sikeyim, ben niye eve kapanmıyorum ki amk" diye kendi kendine sövdü. Tuvaletten çıkmaya çalışırken kapı sıkıştı.

Berat kapının kolunu zorladı, asıldı ama gıcırtılı kapı bir türlü açılmadı. "İmdat amk! Kapıda kaldım!" diye bağırmaya başladı ama dışarıdaki halay müziğinin sesinden kimse bunu duymadı. Berat tuvalette kilitli kalmıştı amk. Yaklaşık iki saat boyunca o daracık, leş kokulu tuvalette sırasını bekleyen hamam böcekleriyle baş başa oturdu.

Düğün bittikten sonra temizlikçi adam kapıyı dışarıdan açtı. Berat’ı tuvalette büzüşmüş bir halde görünce "Ulan ne işin var burada sapık mısın amk?" diye bağırdı. Berat cevap bile veremeden tuvaletten fırlayıp koşarak eve doğru kaçtı. Aura puanı artık Ölçülemeyecek kadar düşüktü amk.`,

      `SAYFA 13

Eve varıp odasına kapanan Berat, o melezi çıkardı, fırlattı attı. Duşa bile girmeden üstüne o üç haftalık kirli eşofmanını geçirdi ve bilgisayarın başına tünedi. Discord'u açtığında sunucudaki o velet yine oradaydı.

"Ooo düğün çocuğu, nasıl geçti halay amk?" diye dalga geçti velet. Berat sinirden köpürdü: "Sanane ulan oç! Sen kimsin ki benimle dalga geçiyorsun, gel CS2'ye 1v1 atalım yüreğin yetiyorsa!" dedi. Velet kabul etti: "Gel bakalım ezik, seni haritada felç edeyim de gör."

Maç başladı. Berat daha ilk rauntta kafasından tek mermiyi yedi. İkinci raunt yine tek mermi. Üçüncü raunt Berat kendi attığı el bombasına kafa atıp kendini patlattı amk. Velet kahkahalar atıyordu: "Lan senin elin ayağın tutmuyor mu amk, bilgisayarı ayaklarınla mı oynuyorsun?" Berat sinir krizine girdi, kulaklığı duvara fırlattı. Kulaklığın sol tarafı kırıldı.`,

      `SAYFA 14

Saadet teyze içeri daldı. "Ulan zevzek! Düğünde rezil ettiğin yetmedi, tuvalette kilitli kalıp millete kendini güldürdün! Mahallede adım kalmadı senin yüzünden piç!" diye bağırıp elindeki oklavayı Berat’ın bacağına geçirdi. Berat "Ayyy anne valla kapı bozuktu amk!" diye bağırarak yatağın arkasına saklandı.

Saadet teyze nefes nefese "Yarın sabah ilk iş bakkal Hüseyin’in yanına çırak olarak gireceksin! Çalışıp o kırdığın kulaklığın parasını da, yediğin yoğurdun parasını da ödeyeceksin amk hayırsızı!" dedi ve kapıyı çarptı. Berat’ın dünyası başına yıkılmıştı. Çalışmak mı? İnsan içine çıkmak mı? Bu onun için ölümden beterdi amk.`,

      `SAYFA 15

      `SAYFA 16

"Ulan ulan! Yine mi rezillik amk!" diye kükredi Saadet teyze. "Bu sefer seni ben bile kurtaramam!" diyerek elindeki bulaşık süngerini Berat’ın kafasına fırlattı. Berat odasına fırladı, kapıyı sürgüledi. "Benim bu dünyadaki şansımı sikeyim amk" diye ağlamaya başladı. Günün sonunda yine ezik, yine başarısız, yine leş gibi kokan bir insan artığıydı.`,

      `SAYFA 17

    let currentPage = 0;

    function renderPage() {
      const pageTextEl = document.getElementById('page-text');
      const pageNumEl = document.getElementById('page-num');
      const prevBtn = document.getElementById('prev-btn');
      const nextBtn = document.getElementById('next-btn');

      pageTextEl.innerText = pages[currentPage];
      pageNumEl.innerText = `Sayfa ${currentPage + 1} / ${pages.length}`;

      prevBtn.disabled = currentPage === 0;
      nextBtn.disabled = currentPage === pages.length - 1;

      // Sayfa değişince en üste kaydır
      pageTextEl.scrollTop = 0;
    }

    function nextPage() {
      if (currentPage < pages.length - 1) {
        currentPage++;
        renderPage();
      }
    }

    function prevPage() {
      if (currentPage > 0) {
        currentPage--;
        renderPage();
      }
    }

    // Sağ - Sol klavye ok tuşları ile sayfa değiştirme
    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight') {
        nextPage();
      } else if (e.key === 'ArrowLeft') {
        prevPage();
      }
    });

    // İlk yüklemede çalıştır
    renderPage();
  </script>
